[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipd-agent-workflow-skill"
version = "0.4.1b1"
description = "Bilingual IPD Agent Workflow Framework with tailoring, execution state, dashboards, and repository reconciliation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ipd", "workflow", "ai-agent", "traceability", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill"
Repository = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill.git"
Issues = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill/issues"

[project.scripts]
ipdctl = "ipdctl.cli_v2:main"

[tool.setuptools]
packages = ["ipdctl"]
include-package-data = true

[tool.setuptools.package-data]
ipdctl = ["messages.yaml"]

[tool.setuptools.data-files]
"share/ipd-agent-workflow-skill/policies/default" = ["policies/default/*.yaml"]
"share/ipd-agent-workflow-skill/policies/task-types" = ["policies/task-types/*.yaml"]
"share/ipd-agent-workflow-skill/policies/capabilities" = ["policies/capabilities/*.yaml"]
"share/ipd-agent-workflow-skill/schemas" = ["schemas/*.json"]
"share/ipd-agent-workflow-skill/templates/hooks" = ["templates/hooks/*.sh"]
"share/ipd-agent-workflow-skill/templates/project/.ipd" = ["templates/project/.ipd/README.md", "templates/project/.ipd/task_profile.yaml", "templates/project/.ipd/process_extensions.yaml"]
"share/ipd-agent-workflow-skill/templates/project/docs" = ["templates/project/docs/README.md"]
"share/ipd-agent-workflow-skill/templates/project/dashboard" = ["templates/project/dashboard/README.md"]
"share/ipd-agent-workflow-skill/templates/project/state" = ["templates/project/state/README.md"]
"share/ipd-agent-workflow-skill/templates/project/src" = ["templates/project/src/.gitkeep"]
"share/ipd-agent-workflow-skill/templates/project/tests" = ["templates/project/tests/.gitkeep"]
