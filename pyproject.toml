[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipd-agent-workflow-skill"
version = "0.1.0a1"
description = "Traceable IPD workflow state, gate, dependency, and repository tooling for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ipd", "workflow", "ai-agent", "traceability", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill"
Repository = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill.git"
Issues = "https://github.com/zju-CS-yzy/ipd-agent-workflow-skill/issues"

[project.scripts]
ipdctl = "ipdctl.cli:main"

[tool.setuptools]
packages = ["ipdctl"]
