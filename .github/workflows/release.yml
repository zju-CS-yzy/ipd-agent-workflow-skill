name: release

on:
  push:
    tags:
      - "v0.3.2-beta"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Verify release source
        run: |
          python -B scripts/release_check.py .
          python -m pip install . build
          python -B scripts/verify_v031_upgrade.py
          python -B -m unittest discover -s tests -v
      - name: Build the single bilingual distribution
        shell: bash
        run: |
          python -m build --outdir dist
          git archive \
            --format=zip \
            --prefix=ipd-agent-workflow-skill/ \
            --output=dist/ipd-agent-workflow-skill-v0.3.2-beta.zip \
            HEAD
          cd dist
          sha256sum \
            ipd-agent-workflow-skill-v0.3.2-beta.zip \
            ipd_agent_workflow_skill-0.3.2b1-py3-none-any.whl \
            ipd_agent_workflow_skill-0.3.2b1.tar.gz \
            > SHA256SUMS.txt
      - name: Inspect and smoke-test release artifacts
        shell: bash
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          skill_zip="$GITHUB_WORKSPACE/dist/ipd-agent-workflow-skill-v0.3.2-beta.zip"
          python -m zipfile -l "$wheel" | grep 'ipdctl/messages.yaml'
          python -m zipfile -l "$wheel" | grep 'schemas/artifact_bindings.schema.json'
          tar -tzf "$sdist" | grep '/ipdctl/messages.yaml$'
          tar -tzf "$sdist" | grep '/schemas/artifact_bindings.schema.json$'
          cd "$RUNNER_TEMP"
          python -m zipfile -e "$skill_zip" "$RUNNER_TEMP/skill-source"
          skill_root="$RUNNER_TEMP/skill-source/ipd-agent-workflow-skill"
          test -f "$skill_root/SKILL.md"
          test -f "$skill_root/agents/openai.yaml"
          test -f "$skill_root/ipdctl/messages.yaml"
          test -f "$skill_root/schemas/artifact_bindings.schema.json"
          artifact_index=0
          for artifact in "$wheel" "$sdist" "$skill_root"; do
            artifact_index=$((artifact_index + 1))
            environment="$RUNNER_TEMP/release-venv-$artifact_index"
            python -m venv "$environment"
            "$environment/bin/pip" install "$artifact"
            for locale in en zh-CN; do
              project="$(mktemp -d)/project-$locale"
              "$environment/bin/ipdctl" init "$project" --name "release-$locale" --locale "$locale"
              "$environment/bin/ipdctl" tailor "$project"
              "$environment/bin/ipdctl" context "$project"
              "$environment/bin/ipdctl" validate "$project"
              "$environment/bin/ipdctl" refresh "$project"
              "$environment/bin/ipdctl" verify "$project"
              test "$(find "$project/.ipd/dashboard" -type f | wc -l)" -eq 15
            done
          done
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          name: "IPD Agent Workflow Framework v0.3.2-beta"
          body_path: .github/release-notes/v0.3.2-beta.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/ipd-agent-workflow-skill-v0.3.2-beta.zip
            dist/ipd_agent_workflow_skill-0.3.2b1-py3-none-any.whl
            dist/ipd_agent_workflow_skill-0.3.2b1.tar.gz
            dist/SHA256SUMS.txt
