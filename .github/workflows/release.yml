name: release

on:
  push:
    tags:
      - "v0.5.0-beta"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Verify release source
        run: |
          python -B scripts/release_check.py .
          python -m pip install . build
          python -B scripts/verify_v031_upgrade.py
          python -B scripts/verify_v032_upgrade.py
          python -B scripts/verify_v040_upgrade.py
          python -B scripts/verify_v041_upgrade.py
          python -B -m unittest discover -s tests -v
          IPD_TEST_LOCALE=en python -B -m unittest \
            tests.test_full_lifecycle_simulation -v
      - name: Build the single bilingual distribution
        shell: bash
        run: |
          python -m build --outdir dist
          git archive \
            --format=zip \
            --prefix=ipd-agent-workflow-skill/ \
            --output=dist/ipd-agent-workflow-skill-v0.5.0-beta.zip \
            HEAD
          cd dist
          sha256sum \
            ipd-agent-workflow-skill-v0.5.0-beta.zip \
            ipd_agent_workflow_skill-0.5.0b1-py3-none-any.whl \
            ipd_agent_workflow_skill-0.5.0b1.tar.gz \
            > SHA256SUMS.txt
      - name: Inspect and smoke-test release artifacts
        shell: bash
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          skill_zip="$GITHUB_WORKSPACE/dist/ipd-agent-workflow-skill-v0.5.0-beta.zip"
          python -m zipfile -l "$wheel" | grep 'ipdctl/messages.yaml'
          python -m zipfile -l "$wheel" | grep 'schemas/artifact_bindings.schema.json'
          python -m zipfile -l "$wheel" | grep 'schemas/capability_policy.schema.json'
          python -m zipfile -l "$wheel" | grep 'schemas/process_extensions.schema.json'
          python -m zipfile -l "$wheel" | grep 'schemas/refinement_plan.schema.json'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/sourced_component_integration.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/module_decomposition_and_verification.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/interface_contract_and_integration.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/release_and_lifecycle_assurance.yaml'
          python -m zipfile -l "$wheel" | grep 'templates/project/.ipd/process_extensions.yaml'
          tar -tzf "$sdist" | grep '/ipdctl/messages.yaml$'
          tar -tzf "$sdist" | grep '/schemas/artifact_bindings.schema.json$'
          tar -tzf "$sdist" | grep '/schemas/capability_policy.schema.json$'
          tar -tzf "$sdist" | grep '/schemas/process_extensions.schema.json$'
          tar -tzf "$sdist" | grep '/schemas/refinement_plan.schema.json$'
          tar -tzf "$sdist" | grep '/scripts/simulate_capability_lifecycle.py$'
          tar -tzf "$sdist" | grep '/scripts/simulate_progressive_refinement.py$'
          tar -tzf "$sdist" | grep '/scripts/verify_v040_upgrade.py$'
          tar -tzf "$sdist" | grep '/scripts/verify_v041_upgrade.py$'
          tar -tzf "$sdist" | grep '/policies/capabilities/sourced_component_integration.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/module_decomposition_and_verification.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/interface_contract_and_integration.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/release_and_lifecycle_assurance.yaml$'
          tar -tzf "$sdist" | grep '/templates/project/.ipd/process_extensions.yaml$'
          mkdir -p "$RUNNER_TEMP/wheel-progressive"
          cp "$GITHUB_WORKSPACE/scripts/simulate_progressive_refinement.py" \
            "$RUNNER_TEMP/wheel-progressive/simulate_progressive_refinement.py"
          cd "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/sdist-source"
          tar -xzf "$sdist" -C "$RUNNER_TEMP/sdist-source"
          sdist_root="$(find "$RUNNER_TEMP/sdist-source" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          mkdir -p "$RUNNER_TEMP/sdist-progressive"
          cp "$sdist_root/scripts/simulate_progressive_refinement.py" \
            "$RUNNER_TEMP/sdist-progressive/simulate_progressive_refinement.py"
          python -m venv "$RUNNER_TEMP/sdist-validation-venv"
          "$RUNNER_TEMP/sdist-validation-venv/bin/pip" install "$sdist"
          cd "$RUNNER_TEMP/sdist-progressive"
          "$RUNNER_TEMP/sdist-validation-venv/bin/python" -B \
            simulate_progressive_refinement.py --json
          cd "$sdist_root"
          "$RUNNER_TEMP/sdist-validation-venv/bin/python" -B -m unittest tests.test_progressive_refinement_simulation -v
          python -m venv "$RUNNER_TEMP/wheel-refinement-venv"
          "$RUNNER_TEMP/wheel-refinement-venv/bin/pip" install "$wheel"
          cd "$RUNNER_TEMP/wheel-progressive"
          "$RUNNER_TEMP/wheel-refinement-venv/bin/python" -B \
            simulate_progressive_refinement.py --json
          cd "$RUNNER_TEMP"
          python -m zipfile -e "$skill_zip" "$RUNNER_TEMP/skill-source"
          skill_root="$RUNNER_TEMP/skill-source/ipd-agent-workflow-skill"
          test -f "$skill_root/SKILL.md"
          test -f "$skill_root/agents/openai.yaml"
          test -f "$skill_root/ipdctl/messages.yaml"
          test -f "$skill_root/schemas/artifact_bindings.schema.json"
          test -f "$skill_root/schemas/capability_policy.schema.json"
          test -f "$skill_root/schemas/process_extensions.schema.json"
          test -f "$skill_root/schemas/refinement_plan.schema.json"
          test -f "$skill_root/scripts/simulate_capability_lifecycle.py"
          test -f "$skill_root/policies/capabilities/sourced_component_integration.yaml"
          test -f "$skill_root/policies/capabilities/module_decomposition_and_verification.yaml"
          test -f "$skill_root/policies/capabilities/interface_contract_and_integration.yaml"
          test -f "$skill_root/policies/capabilities/release_and_lifecycle_assurance.yaml"
          test -f "$skill_root/templates/project/.ipd/process_extensions.yaml"
          artifact_index=0
          for artifact in "$wheel" "$sdist" "$skill_root"; do
            artifact_index=$((artifact_index + 1))
            environment="$RUNNER_TEMP/release-venv-$artifact_index"
            python -m venv "$environment"
            "$environment/bin/pip" install "$artifact"
            for pattern in \
              sourced_component_integration \
              module_decomposition_and_verification \
              interface_contract_and_integration \
              release_and_lifecycle_assurance; do
              project="$(mktemp -d)/catalog-$pattern"
              "$environment/bin/ipdctl" init "$project" --name "catalog-$pattern" --locale en
              "$environment/bin/python" -c 'from pathlib import Path; import sys, yaml; p=Path(sys.argv[1]); data=yaml.safe_load(p.read_text(encoding="utf-8")); data["capability_patterns"]=[sys.argv[2]]; p.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding="utf-8")' "$project/.ipd/task_profile.yaml" "$pattern"
              "$environment/bin/ipdctl" tailor "$project"
              "$environment/bin/ipdctl" validate "$project" --json
            done
            for locale in en zh-CN; do
              project="$(mktemp -d)/project-$locale"
              "$environment/bin/ipdctl" init "$project" --name "release-$locale" --locale "$locale"
              "$environment/bin/python" -c 'from pathlib import Path; import sys, yaml; p=Path(sys.argv[1]); data=yaml.safe_load(p.read_text(encoding="utf-8")); data["capability_patterns"]=["sourced_component_integration"]; p.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding="utf-8")' "$project/.ipd/task_profile.yaml"
              "$environment/bin/ipdctl" tailor "$project"
              "$environment/bin/ipdctl" context "$project"
              "$environment/bin/ipdctl" validate "$project" --json
              "$environment/bin/ipdctl" refresh "$project"
              "$environment/bin/ipdctl" verify "$project"
              test "$(find "$project/.ipd/dashboard" -type f | wc -l)" -eq 15
            done
          done
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          name: "IPD Agent Workflow Framework v0.5.0-beta"
          body_path: .github/release-notes/v0.5.0-beta.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/ipd-agent-workflow-skill-v0.5.0-beta.zip
            dist/ipd_agent_workflow_skill-0.5.0b1-py3-none-any.whl
            dist/ipd_agent_workflow_skill-0.5.0b1.tar.gz
            dist/SHA256SUMS.txt
