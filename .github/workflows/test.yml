name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        locale: ["en", "zh-CN"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check release tree
        run: python -B scripts/release_check.py .
      - name: Install package
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q ipdctl
      - name: Run behavior tests
        env:
          IPD_TEST_LOCALE: ${{ matrix.locale }}
        run: python -B -m unittest discover -s tests -v
      - name: Smoke-test lifecycle
        shell: bash
        run: |
          project="$(mktemp -d)"
          ipdctl init "$project/test-project" --name test-project --locale "${{ matrix.locale }}"
          ipdctl tailor "$project/test-project"
          ipdctl context "$project/test-project"
          ipdctl refresh "$project/test-project"
          ipdctl verify "$project/test-project"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Inspect package contents
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m zipfile -l "$wheel" | grep 'ipdctl/messages.yaml'
          python -m zipfile -l "$wheel" | grep 'schemas/capability_policy.schema.json'
          python -m zipfile -l "$wheel" | grep 'schemas/process_extensions.schema.json'
          python -m zipfile -l "$wheel" | grep 'schemas/refinement_plan.schema.json'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/sourced_component_integration.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/module_decomposition_and_verification.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/interface_contract_and_integration.yaml'
          python -m zipfile -l "$wheel" | grep 'policies/capabilities/release_and_lifecycle_assurance.yaml'
          python -m zipfile -l "$wheel" | grep 'templates/project/.ipd/process_extensions.yaml'
          tar -tzf "$sdist" | grep '/ipdctl/messages.yaml$'
          tar -tzf "$sdist" | grep '/schemas/capability_policy.schema.json$'
          tar -tzf "$sdist" | grep '/schemas/process_extensions.schema.json$'
          tar -tzf "$sdist" | grep '/schemas/refinement_plan.schema.json$'
          tar -tzf "$sdist" | grep '/scripts/simulate_capability_lifecycle.py$'
          tar -tzf "$sdist" | grep '/scripts/simulate_progressive_refinement.py$'
          tar -tzf "$sdist" | grep '/scripts/verify_v041_upgrade.py$'
          tar -tzf "$sdist" | grep '/scripts/verify_v050_upgrade.py$'
          tar -tzf "$sdist" | grep '/policies/capabilities/sourced_component_integration.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/module_decomposition_and_verification.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/interface_contract_and_integration.yaml$'
          tar -tzf "$sdist" | grep '/policies/capabilities/release_and_lifecycle_assurance.yaml$'
          tar -tzf "$sdist" | grep '/templates/project/.ipd/process_extensions.yaml$'
      - name: Test progressive refinement from extracted sdist
        shell: bash
        run: |
          sdist="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          mkdir -p "$RUNNER_TEMP/sdist-source"
          tar -xzf "$sdist" -C "$RUNNER_TEMP/sdist-source"
          source_root="$(find "$RUNNER_TEMP/sdist-source" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          mkdir -p "$RUNNER_TEMP/sdist-progressive"
          cp "$source_root/scripts/simulate_progressive_refinement.py" \
            "$RUNNER_TEMP/sdist-progressive/simulate_progressive_refinement.py"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install "$sdist"
          cd "$RUNNER_TEMP/sdist-progressive"
          "$RUNNER_TEMP/sdist-venv/bin/python" -B \
            simulate_progressive_refinement.py --json
          cd "$RUNNER_TEMP"
          for pattern in \
            sourced_component_integration \
            module_decomposition_and_verification \
            interface_contract_and_integration \
            release_and_lifecycle_assurance; do
            project="$(mktemp -d)/catalog-$pattern"
            "$RUNNER_TEMP/sdist-venv/bin/ipdctl" init "$project" --name "catalog-$pattern" --locale en
            "$RUNNER_TEMP/sdist-venv/bin/python" -c 'from pathlib import Path; import sys, yaml; p=Path(sys.argv[1]); data=yaml.safe_load(p.read_text(encoding="utf-8")); data["capability_patterns"]=[sys.argv[2]]; p.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding="utf-8")' "$project/.ipd/task_profile.yaml" "$pattern"
            "$RUNNER_TEMP/sdist-venv/bin/ipdctl" tailor "$project"
            "$RUNNER_TEMP/sdist-venv/bin/ipdctl" render-dashboard "$project"
            "$RUNNER_TEMP/sdist-venv/bin/ipdctl" validate "$project" --json
          done
          cd "$source_root"
          "$RUNNER_TEMP/sdist-venv/bin/python" -B -m unittest tests.test_progressive_refinement_simulation -v
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          mkdir -p "$RUNNER_TEMP/wheel-progressive"
          cp scripts/simulate_progressive_refinement.py \
            "$RUNNER_TEMP/wheel-progressive/simulate_progressive_refinement.py"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$wheel"
          cd "$RUNNER_TEMP/wheel-progressive"
          "$RUNNER_TEMP/venv/bin/python" -B \
            simulate_progressive_refinement.py --json
          cd "$RUNNER_TEMP"
          for pattern in \
            sourced_component_integration \
            module_decomposition_and_verification \
            interface_contract_and_integration \
            release_and_lifecycle_assurance; do
            project="$(mktemp -d)/catalog-$pattern"
            "$RUNNER_TEMP/venv/bin/ipdctl" init "$project" --name "catalog-$pattern" --locale en
            "$RUNNER_TEMP/venv/bin/python" -c 'from pathlib import Path; import sys, yaml; p=Path(sys.argv[1]); data=yaml.safe_load(p.read_text(encoding="utf-8")); data["capability_patterns"]=[sys.argv[2]]; p.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding="utf-8")' "$project/.ipd/task_profile.yaml" "$pattern"
            "$RUNNER_TEMP/venv/bin/ipdctl" tailor "$project"
            "$RUNNER_TEMP/venv/bin/ipdctl" render-dashboard "$project"
            "$RUNNER_TEMP/venv/bin/ipdctl" validate "$project" --json
          done
          for locale in en zh-CN; do
            project="$(mktemp -d)/project-$locale"
            "$RUNNER_TEMP/venv/bin/ipdctl" init "$project" --name "package-$locale" --locale "$locale"
            "$RUNNER_TEMP/venv/bin/python" -c 'from pathlib import Path; import sys, yaml; p=Path(sys.argv[1]); data=yaml.safe_load(p.read_text(encoding="utf-8")); data["capability_patterns"]=["sourced_component_integration"]; p.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding="utf-8")' "$project/.ipd/task_profile.yaml"
            "$RUNNER_TEMP/venv/bin/ipdctl" tailor "$project"
            "$RUNNER_TEMP/venv/bin/ipdctl" context "$project"
            "$RUNNER_TEMP/venv/bin/ipdctl" refresh "$project"
            "$RUNNER_TEMP/venv/bin/ipdctl" verify "$project"
          done

  upgrade-v031:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install current package
        run: python -m pip install .
      - name: Qualify the published v0.3.1 project upgrade
        run: python -B scripts/verify_v031_upgrade.py

  upgrade-v032:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current package
        run: python -m pip install .
      - name: Qualify the published v0.3.2 project upgrade
        run: python -B scripts/verify_v032_upgrade.py

  upgrade-v040:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current package
        run: python -m pip install .
      - name: Qualify the published v0.4.0 project upgrade
        run: python -B scripts/verify_v040_upgrade.py

  upgrade-v041:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current package
        run: python -m pip install .
      - name: Qualify v0.4.1-beta to v0.5.0-beta
        run: python -B scripts/verify_v041_upgrade.py

  upgrade-v050:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current package
        run: python -m pip install .
      - name: Qualify v0.5.0-beta to v0.5.1-beta
        run: python -B scripts/verify_v050_upgrade.py

  governance-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
      - package
      - upgrade-v031
      - upgrade-v032
      - upgrade-v040
      - upgrade-v041
      - upgrade-v050
      - dashboard-browser
    steps:
      - name: Require every release-contract job
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          UPGRADE_V031_RESULT: ${{ needs.upgrade-v031.result }}
          UPGRADE_V032_RESULT: ${{ needs.upgrade-v032.result }}
          UPGRADE_V040_RESULT: ${{ needs.upgrade-v040.result }}
          UPGRADE_V041_RESULT: ${{ needs.upgrade-v041.result }}
          UPGRADE_V050_RESULT: ${{ needs.upgrade-v050.result }}
          DASHBOARD_BROWSER_RESULT: ${{ needs.dashboard-browser.result }}
        run: |
          printf 'test=%s package=%s upgrade-v031=%s upgrade-v032=%s upgrade-v040=%s upgrade-v041=%s upgrade-v050=%s\n' \
            "$TEST_RESULT" "$PACKAGE_RESULT" \
            "$UPGRADE_V031_RESULT" "$UPGRADE_V032_RESULT" \
            "$UPGRADE_V040_RESULT" "$UPGRADE_V041_RESULT" \
            "$UPGRADE_V050_RESULT"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$UPGRADE_V031_RESULT" = "success"
          test "$UPGRADE_V032_RESULT" = "success"
          test "$UPGRADE_V040_RESULT" = "success"
          test "$UPGRADE_V041_RESULT" = "success"
          test "$UPGRADE_V050_RESULT" = "success"
          printf 'dashboard-browser=%s\n' "$DASHBOARD_BROWSER_RESULT"
          test "$DASHBOARD_BROWSER_RESULT" = "success"

  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install browser test dependencies
        run: |
          python -m pip install . playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify bilingual offline and HTTP Dashboard interactions
        run: python -B scripts/verify_dashboard_browser.py --output "$RUNNER_TEMP/dashboard-browser"
