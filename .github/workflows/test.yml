name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check release tree
        run: python -B scripts/release_check.py .
      - name: Install package
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q ipdctl
      - name: Run behavior tests
        run: python -B -m unittest discover -s tests -v
      - name: Smoke-test lifecycle
        shell: bash
        run: |
          project="$(mktemp -d)"
          ipdctl init "$project/test-project" --name test-project
          ipdctl tailor "$project/test-project"
          ipdctl context "$project/test-project"
          ipdctl refresh "$project/test-project"
          ipdctl verify "$project/test-project"
